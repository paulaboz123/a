parameters:
  - name: environment
    type: string
    values: [dev, test, prod]

  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: amlWorkspace
    type: string

  # Keep BU like in your original code
  - name: bu
    type: string

  # Batch compute cluster (AmlCompute)
  - name: batchCompute
    type: string

  # Submit job (required to actually process data)
  - name: jobDeploymentName
    type: string
    default: en-model
  - name: jobInput
    type: string
  - name: jobOutput
    type: string

steps:
  - checkout: self

  - task: Bash@3
    displayName: Install libraries
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        az extension add -n ml -y || az extension update -n ml
        pip install --upgrade pip
        pip install "paramiko>=2.11.0" "cryptography>=3.4.8"
        az upgrade --yes

        if ! command -v yq >/dev/null 2>&1; then
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi

  - task: AzureCLI@2
    name: deploy_batch_endpoint
    displayName: Deploy Batch Endpoint (create/update)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: false
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        WORKDIR="src/deployment/batch_endpoint/${{ parameters.environment }}"
        RENDERDIR="$WORKDIR/_rendered"
        mkdir -p "$RENDERDIR"

        BU_LOWER="$(echo "${{ parameters.bu }}" | tr '[:upper:]' '[:lower:]')"
        ENDPOINT_FILE="$RENDERDIR/endpoint-${BU_LOWER}.yml"

        # Render endpoint template -> endpoint-${bu}.yml
        ENDPOINT_NAME="${BU_LOWER}-batch-${{ parameters.environment }}"
        sed           -e "s/__ENDPOINT_NAME__/${ENDPOINT_NAME}/g"           "$WORKDIR/templates/endpoint.template.yml" > "$ENDPOINT_FILE"

        echo "Rendered ENDPOINT_FILE=$ENDPOINT_FILE"
        echo "Rendered ENDPOINT_NAME=$ENDPOINT_NAME"

        if az ml batch-endpoint show -n "$ENDPOINT_NAME" >/dev/null 2>&1; then
          az ml batch-endpoint update -f "$ENDPOINT_FILE"
        else
          az ml batch-endpoint create -f "$ENDPOINT_FILE"
        fi

  - task: AzureCLI@2
    name: deploy_batch_deployments
    displayName: Deploy 3 Batch Deployments (create/update)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: false
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        WORKDIR="src/deployment/batch_endpoint/${{ parameters.environment }}"
        RENDERDIR="$WORKDIR/_rendered"
        mkdir -p "$RENDERDIR"

        BU_LOWER="$(echo "${{ parameters.bu }}" | tr '[:upper:]' '[:lower:]')"
        ENDPOINT_NAME="${BU_LOWER}-batch-${{ parameters.environment }}"

        render_deployment () {
          local lang="$1"
          local model_name="$2"
          local deploy_name="${lang}-model"
          local src="$WORKDIR/templates/deployment-${lang}.template.yml"
          local out="$RENDERDIR/deployment-${BU_LOWER}-${lang}.yml"

          sed             -e "s/__DEPLOYMENT_NAME__/${deploy_name}/g"             -e "s/__ENDPOINT_NAME__/${ENDPOINT_NAME}/g"             -e "s#__CODE_DIR__#${WORKDIR}/scoring#g"             -e "s/__MODEL_ASSET__/${model_name}/g"             "$src" > "$out"

          echo "$out"
        }

        # Model asset strings can be overridden by editing templates
        DEPLOY_DE_FILE="$(render_deployment de "azureml:de@latest")"
        DEPLOY_PL_FILE="$(render_deployment pl "azureml:pl@latest")"
        DEPLOY_EN_FILE="$(render_deployment en "azureml:en@latest")"

        deploy_one () {
          local file="$1"
          local dname
          local ename
          dname="$(yq -r '.name' "$file")"
          ename="$(yq -r '.endpoint_name' "$file")"

          if az ml batch-deployment show -e "$ename" -n "$dname" >/dev/null 2>&1; then
            az ml batch-deployment update -f "$file" --set compute="azureml:${{ parameters.batchCompute }}"
          else
            az ml batch-deployment create -f "$file" --set compute="azureml:${{ parameters.batchCompute }}"
          fi
        }

        deploy_one "$DEPLOY_DE_FILE"
        deploy_one "$DEPLOY_PL_FILE"
        deploy_one "$DEPLOY_EN_FILE"

  - task: AzureCLI@2
    name: submit_batch_job
    displayName: Submit Batch Job (so analysis runs)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: false
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        BU_LOWER="$(echo "${{ parameters.bu }}" | tr '[:upper:]' '[:lower:]')"
        ENDPOINT_NAME="${BU_LOWER}-batch-${{ parameters.environment }}"

        if [ -z "${{ parameters.jobInput }}" ] || [ -z "${{ parameters.jobOutput }}" ]; then
          echo "jobInput and jobOutput are required."
          exit 1
        fi

        az ml batch-endpoint invoke           -n "$ENDPOINT_NAME"           --deployment-name "${{ parameters.jobDeploymentName }}"           --input "${{ parameters.jobInput }}"           --output "${{ parameters.jobOutput }}"

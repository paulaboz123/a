parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: appServiceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: amlWorkspace
    type: string
  - name: keyVaultName
    type: string
  - name: bu
    type: string
  - name: functionAppName
    type: string
  - name: appResourceGroup
    type: string

  # Batch compute (AmlCompute cluster name)
  - name: batchCompute
    type: string

  # Submit job (Batch does nothing until a job is submitted)
  - name: jobDeploymentName
    type: string
  - name: jobInput
    type: string
  - name: jobOutput
    type: string

  # Keep the step "1:1" with your existing template; set to 'true' only if you still need it.
  - name: restartFunctionApp
    type: boolean
    default: false

steps:
  - checkout: self

  - task: Bash@3
    displayName: Install libraries
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        az extension add -n ml -y || az extension update -n ml
        pip install --upgrade pip
        pip install "paramiko>=2.11.0" "cryptography>=3.4.8"
        az upgrade --yes

        if ! command -v yq >/dev/null 2>&1; then
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi

  - task: AzureCLI@2
    name: deploy_managed_endpoint
    displayName: Deploy Managed Endpoint (BATCH)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: false
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        ENDPOINT_FILE="endpoint-${{ lower(parameters.bu) }}.yml"
        ENDPOINT_NAME="$(yq -r '.name' "$ENDPOINT_FILE")"

        if az ml batch-endpoint show -n "$ENDPOINT_NAME" >/dev/null 2>&1; then
          echo "Update batch endpoint: $ENDPOINT_NAME"
          az ml batch-endpoint update -f "$ENDPOINT_FILE"
        else
          echo "Create batch endpoint: $ENDPOINT_NAME"
          az ml batch-endpoint create -f "$ENDPOINT_FILE"
        fi
    workingDirectory: src/deployment/batch_endpoint/${{ parameters.environment }}/

  - task: AzureCLI@2
    name: deploy_model_managed_endpoint
    displayName: Deploy Models To Managed Endpoint (BATCH) - 3 deployments
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: false
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        deploy_one () {
          local file="$1"
          local endpoint
          local name
          endpoint="$(yq -r '.endpoint_name' "$file")"
          name="$(yq -r '.name' "$file")"

          if az ml batch-deployment show -e "$endpoint" -n "$name" >/dev/null 2>&1; then
            echo "Update batch deployment: $name"
            az ml batch-deployment update -f "$file" --set compute="azureml:${{ parameters.batchCompute }}"
          else
            echo "Create batch deployment: $name"
            az ml batch-deployment create -f "$file" --set compute="azureml:${{ parameters.batchCompute }}"
          fi
        }

        BU="${{ lower(parameters.bu) }}"
        deploy_one "deployment-${BU}-de.yml"
        deploy_one "deployment-${BU}-pl.yml"
        deploy_one "deployment-${BU}-en.yml"
    workingDirectory: src/deployment/batch_endpoint/${{ parameters.environment }}/

  - task: AzureCLI@2
    name: submit_batch_job
    displayName: Submit Batch Job (invoke)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: true
      inlineScript: |
        set -euo pipefail

        az configure --defaults workspace=${{ parameters.amlWorkspace }} group=${{ parameters.resourceGroup }}

        ENDPOINT_FILE="endpoint-${{ lower(parameters.bu) }}.yml"
        ENDPOINT_NAME="$(yq -r '.name' "$ENDPOINT_FILE")"

        if [ -z "${{ parameters.jobInput }}" ] || [ -z "${{ parameters.jobOutput }}" ] || [ -z "${{ parameters.jobDeploymentName }}" ]; then
          echo "jobInput/jobOutput/jobDeploymentName must be set to submit a Batch job."
          exit 1
        fi

        echo "Submitting job: endpoint=$ENDPOINT_NAME deployment=${{ parameters.jobDeploymentName }}"
        az ml batch-endpoint invoke           -n "$ENDPOINT_NAME"           --deployment-name "${{ parameters.jobDeploymentName }}"           --input "${{ parameters.jobInput }}"           --output "${{ parameters.jobOutput }}"
    workingDirectory: src/deployment/batch_endpoint/${{ parameters.environment }}/

  - task: AzureCLI@2
    name: restart_function_app
    displayName: Restart function app (optional)
    condition: and(succeeded(), eq('${{ parameters.restartFunctionApp }}', 'true'))
    inputs:
      azureSubscription: ${{ parameters.appServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      failOnStandardError: true
      inlineScript: |
        set -euo pipefail
        az functionapp restart --name "${{ parameters.functionAppName }}" --resource-group "${{ parameters.appResourceGroup }}"
